name: SIH26171 Verification

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: sih26171-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full engineering gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser-extension/package-lock.json

      - name: Install system verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Provision backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Provision frontend
        working-directory: frontend
        run: npm ci

      - name: Provision browser extension
        working-directory: browser-extension
        run: npm ci --ignore-scripts

      - name: Run single-command SIH verification
        run: ./scripts/verify_sih_checkpoint.sh --ci

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilgraph-sih26171-verification-${{ github.run_id }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 30
